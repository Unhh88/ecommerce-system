server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: danaco
  datasource:
    url: jdbc:postgresql://localhost:5432/danaco
    username: danaco_user
    password: danaco_password_secure
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    cors:
      allowed-origins: http://localhost:3000, http://localhost:5173
      allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.danaco: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
