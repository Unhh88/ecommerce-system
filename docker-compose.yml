version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: danaco-postgres
    environment:
      POSTGRES_DB: danaco
      POSTGRES_USER: danaco_user
      POSTGRES_PASSWORD: danaco_password_secure
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - danaco-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danaco_user -d danaco"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: danaco-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@danaco.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - danaco-network

volumes:
  postgres_data:

networks:
  danaco-network:
    driver: bridge
